server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/table_tennis_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
  elasticsearch:
    uris: http://127.0.0.1:9200

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: doc-pipeline-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.tabletennis.rag.kafka.DocUploadMessage
    listener:
      ack-mode: manual_immediate

  # ⚠️ 使用前请将本文件复制为 application.yml，并填入你的真实 API Key
  ai:
    openai:
      api-key: YOUR_AGNES_API_KEY
      base-url: https://apihub.agnes-ai.com
      chat:
        options:
          model: agnes-2.5-flash
          temperature: 0.3
      embedding:
        api-key: YOUR_SILICONFLOW_API_KEY
        base-url: https://api.siliconflow.cn
        options:
          model: BAAI/bge-m3
          # 注意：bge-m3 固定1024维，不接受 dimensions 参数，不要在这里配置

# Reranker 重排模型（硅基流动，OpenAI 兼容 /v1/rerank）
rerank:
  base-url: https://api.siliconflow.cn
  api-key: YOUR_SILICONFLOW_API_KEY
  model: BAAI/bge-reranker-v2-m3
